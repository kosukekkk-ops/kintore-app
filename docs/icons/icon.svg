<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Night Gym: 漆黒(わずかに緑寄り)のグラデーション -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1b2013"/>
      <stop offset="0.55" stop-color="#0f1210"/>
      <stop offset="1" stop-color="#080a07"/>
    </linearGradient>
    <!-- 上方からのライムの照り返し -->
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#c6ff3a" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#c6ff3a" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#c6ff3a" stop-opacity="0"/>
    </radialGradient>
    <!-- バーベル本体。上が明るく下が沈む＝金属の立体感 -->
    <linearGradient id="metal" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#e6ff8c"/>
      <stop offset="0.45" stop-color="#c6ff3a"/>
      <stop offset="1" stop-color="#8fbf28"/>
    </linearGradient>
  </defs>

  <!-- 背景(角丸はiOS側でマスクされるが、他プラットフォーム用に保持) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- ダンベル：右肩上がり18度で「伸びていく」を一滴だけ足す -->
  <g transform="rotate(-18 256 256)">
    <!-- 外プレート -->
    <rect x="70"  y="186" width="60"  height="140" rx="26" fill="url(#metal)"/>
    <rect x="382" y="186" width="60"  height="140" rx="26" fill="url(#metal)"/>
    <!-- 内プレート(一回り大きく＝実物のバーベルの見え方) -->
    <rect x="138" y="158" width="72"  height="196" rx="32" fill="url(#metal)"/>
    <rect x="302" y="158" width="72"  height="196" rx="32" fill="url(#metal)"/>
    <!-- シャフト -->
    <rect x="196" y="234" width="120" height="44"  rx="22" fill="url(#metal)"/>
  </g>
</svg>
