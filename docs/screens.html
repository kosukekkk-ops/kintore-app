<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<title>筋トレ記録アプリ — 画面設計と修正メモ</title>
<style>
  :root{--bg:#0f1113;--panel:#171a1d;--line:#282d31;--tx:#e9edf0;--dim:#9aa3aa;--acc:#c6ff3a;--warn:#ff9526}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,19,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
  h1{margin:0;font-size:17px}
  .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .bar button{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:7px 13px;font:600 12px inherit;cursor:pointer}
  .bar button.pri{background:var(--acc);color:#0f1113;border-color:var(--acc)}
  main{padding:16px;max-width:1100px;margin:0 auto}
  .cat{font:700 12px inherit;letter-spacing:.14em;color:var(--dim);margin:26px 0 10px;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .id{font:700 12px ui-monospace,monospace;color:#0f1113;background:var(--acc);border-radius:6px;padding:2px 7px}
  .nm{font-weight:700;font-size:16px}
  .ds{font-size:13px;color:var(--dim);margin:8px 0 12px}
  .body{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .frame{width:375px;height:640px;flex:none;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#0c0e0d;position:relative}
  .frame iframe{width:375px;height:812px;border:0;display:block;transform:scale(.788);transform-origin:0 0}
  .frame{width:296px;height:640px}
  .note{flex:1;min-width:260px}
  .note label{display:block;font:600 11px inherit;letter-spacing:.1em;color:var(--dim);margin-bottom:6px;text-transform:uppercase}
  textarea{width:100%;min-height:150px;background:#101315;border:1px solid var(--line);border-radius:12px;color:var(--tx);
    font:14px/1.7 inherit;padding:12px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--acc)}
  textarea.has{border-color:var(--warn)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tags button{background:#101315;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:5px 9px;font:12px inherit;cursor:pointer}
  .tags button:hover{color:var(--tx);border-color:var(--acc)}
  .count{position:fixed;right:16px;bottom:16px;background:var(--acc);color:#0f1113;border:0;border-radius:999px;
    padding:13px 20px;font:700 14px inherit;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:20}
  dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:16px;max-width:min(720px,92vw);width:100%;padding:18px}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog textarea{min-height:50vh}
  .row{display:flex;gap:8px;margin-top:12px}
  .row button{flex:1;border-radius:10px;padding:11px;font:700 14px inherit;cursor:pointer;border:1px solid var(--line);background:#101315;color:var(--tx)}
  .row button.pri{background:var(--acc);color:#0f1113;border-color:var(--acc)}
  @media(max-width:720px){ .body{flex-direction:column} .frame{width:100%;max-width:296px} }
</style>

<header>
  <h1>筋トレ記録アプリ — 全画面 と 修正メモ</h1>
  <div class="sub">28画面 / v49時点。各画面の右側に修正点を書いてください。入力は自動保存されます。</div>
  <div class="bar">
    <button class="pri" onclick="exportAll()">メモを書き出す</button>
    <button onclick="toggleAll()">画面を折りたたむ</button>
    <button onclick="if(confirm('入力したメモを全部消します。よろしいですか？')){localStorage.removeItem(KEY);location.reload()}">メモを消去</button>
  </div>
</header>

<main id="main"></main>
<button class="count" onclick="exportAll()"><span id="cnt">0</span> 件の修正メモ</button>

<dialog id="dlg">
  <b>修正メモ（このままコピーして渡してください）</b>
  <textarea id="out" readonly></textarea>
  <div class="row">
    <button class="pri" onclick="copyOut()">コピー</button>
    <button onclick="document.getElementById('dlg').close()">閉じる</button>
  </div>
</dialog>

薄い数字/点 */\n  --accent: #c6ff3a;     /* ライム */\n  --accent-2: #8fbf28;   /* 濃ライム */\n  --on-accent: #0c0e0d;  /* アクセント上の文字 */\n  --ok: #c6ff3a;\n  --ng: #f0603a;\n  --warn: #ffd23a;\n  /* 部位カラー(イラスト/タグ用) */\n  --m-chest: #f0603a;\n  --m-back: #4fd08a;\n  --m-legs: #ffd23a;\n  --m-shoulder: #ff9f43;\n  --m-arm: #a78bfa;\n  --m-abs: #38d6c8;\n  --m-cardio: #ff7a45;\n  --fig: #cdd3c6;        /* 動作イラストの人物色 */\n  --font-num: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;\n  --radius: 16px;\n  --tabbar-h: 66px;\n}\n\n/* ===== Night Gym / 黒×オレンジ =====\n   ダーク固定。アクセント切替のみ(lime / orange)。\n   黒の色味もアクセントに合わせて暖色寄りにずらし、全体の統一感を保つ。 */\nhtml[data-accent=\"orange\"] {\n  --bg: #0d0c0a;\n  --bg-card: #17140f;\n  --bg-card2: #1a1712;\n  --bg-elev: #241f19;\n  --bg-hi: #1b1409;\n  --border: #33291b;\n  --border2: #241f19;\n  --text: #efeae4;\n  --text-dim: #98918a;\n  --text-mute: #716b64;\n  --faint: #40352a;\n  --accent: #ff9526;     /* オレンジ */\n  --accent-2: #c96f12;   /* 濃オレンジ */\n  --on-accent: #140f08;  /* アクセント上の文字 */\n  --ok: #ff9526;\n  --ng: #ff5252;         /* アクセントと紛れないよう赤寄りに */\n  --fig: #d4cec7;\n}\n\n* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  font-family: var(--font-num), \"Hiragino Sans\", \"Hiragino Kaku Gothic ProN\", \"Noto Sans JP\", \"Yu Gothic\", sans-serif;\n  background: var(--bg);\n  color: var(--text);\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n}\n.mono { font-family: var(--font-mono); }\n\n/* ---------- layout ---------- */\n#app {\n  max-width: 640px;\n  margin: 0 auto;\n  min-height: 100vh;\n  padding-top: env(safe-area-inset-top);\n  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));\n}\n.view { padding: 16px 16px 24px; display: none; animation: fade .25s ease; }\n.view.active { display: block; }\n@keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }\n\n/* ---------- header ---------- */\n.head {\n  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;\n}\n.head h1 { font-size: 20px; margin: 0; flex: 1; }\n.head .sub { font-size: 12px; color: var(--text-dim); }\n.icon-btn {\n  background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);\n  width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer;\n  display: flex; align-items: center; justify-content: center; flex: none;\n}\n.back-btn {\n  background: none; border: none; color: var(--accent); font-size: 15px; font-family: inherit;\n  cursor: pointer; padding: 4px 0; margin-bottom: 8px;\n}\n\n/* ---------- tab bar ---------- */\nnav.tabbar {\n  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;\n  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));\n  padding-bottom: env(safe-area-inset-bottom);\n  display: flex; background: var(--bg);\n  border-top: 1px solid var(--border2);\n  max-width: 640px; margin: 0 auto;\n}\nnav.tabbar button {\n  flex: 1; background: none; border: none; color: var(--text-mute);\n  display: flex; align-items: center; justify-content: center;\n  padding: 10px 0 16px; cursor: pointer; font-family: inherit;\n}\nnav.tabbar button svg { width: 27px; height: 27px; display: block; transition: transform .12s, color .12s; }\nnav.tabbar button.active { color: var(--text); }\nnav.tabbar button.active svg { transform: scale(1.06); }\n\n/* ---------- cards & common ---------- */\n.card {\n  background: var(--bg-card); border: 1px solid var(--border);\n  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;\n}\n.card h2 { margin: 0 0 10px; font-size: 15px; }\n.card.tap { cursor: pointer; transition: transform .1s; }\n.card.tap:active { transform: scale(.99); }\n.muted { color: var(--text-dim); }\n.small { font-size: 12px; }\n.center { text-align: center; }\n.row { display: flex; gap: 10px; align-items: center; }\n.row.wrap { flex-wrap: wrap; }\n.spacer { flex: 1; }\n\n/* ---------- home 1c (Night Gym) ---------- */\n.ng-top { display: flex; align-items: center; gap: 10px; min-height: 22px; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }\n.ng-top .spacer { flex: 1; }\n.ng-gear { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 0; }\n.ring-row { display: flex; align-items: center; gap: 20px; margin-top: 10px; }\n.ring { width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }\n.ring .hole { width: 96px; height: 96px; border-radius: 50%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }\n.ring .pctn { font: 700 30px var(--font-num); color: var(--text); }\n.ring .pctn small { font-size: 15px; color: var(--text-dim); }\n.ring .rlab { font-size: 9px; color: var(--text-dim); margin-top: 1px; }\n.ring-side { flex: 1; min-width: 0; }\n.big-vol { font: 700 34px var(--font-num); color: var(--text); line-height: 1; }\n.big-vol-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }\n.mini2 { display: flex; gap: 6px; }\n.mini { flex: 1; background: var(--bg-card2); border-radius: 10px; padding: 8px 10px; }\n.mini .n { font: 700 17px var(--font-num); }\n.mini .l { font-size: 9px; color: var(--text-dim); }\n.sec-lbl { font: 600 11px var(--font-num); letter-spacing: .12em; color: var(--text-dim); margin: 22px 0 10px; text-transform: uppercase; }\n/* 3本柱カード(睡眠・食事)。運動はリングが担うので2枚で1行 */\n.pillars { display: flex; gap: 8px; margin-top: 16px; }\n.pillar { flex: 1; min-width: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 11px 14px; cursor: pointer; transition: transform .1s; }\n.pillar:active { transform: scale(.98); }\n.pillar .pi-l { font: 600 10px var(--font-num); letter-spacing: .08em; color: var(--text-dim); margin-bottom: 3px; }\n.pillar .pi-v { font: 700 15px var(--font-num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.pillar .pi-v.dim { color: var(--text-mute); font-weight: 600; font-size: 13px; }\n.pillar .stars { color: var(--warn); font-size: 11px; letter-spacing: 1px; }\n.menu-list { display: flex; flex-direction: column; gap: 8px; }\n.menu-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: transform .1s; }\n.menu-card:active { transform: scale(.99); }\n.menu-card.next { background: var(--bg-hi); border: 1.5px solid var(--accent); }\n.menu-card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }\n.menu-card .dot.on { background: var(--accent); }\n.menu-card .mc-main { flex: 1; min-width: 0; }\n.menu-card .mc-name { font-weight: 700; font-size: 15px; }\n.menu-card .mc-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }\n.menu-card .mc-check { color: var(--accent); font-size: 17px; }\n.menu-card .mc-now { font: 700 10px var(--font-num); color: var(--accent); letter-spacing: .04em; }\n.cta { margin-top: 20px; background: var(--accent); color: var(--on-accent); border-radius: 16px; padding: 16px; text-align: center; font-weight: 700; font-size: 16px; border: none; width: 100%; cursor: pointer; font-family: inherit; transition: transform .1s; }\n.cta:active { transform: scale(.98); }\n.quick-row { display: flex; gap: 10px; margin-top: 12px; }\n.quick { flex: 1; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); border-radius: 12px; padding: 11px; font-family: inherit; font-size: 13px; cursor: pointer; }\n.mt { margin-top: 12px; }\n.mb { margin-bottom: 12px; }\n.hr { height: 1px; background: var(--border); margin: 12px 0; border: 0; }\n.empty { text-align: center; color: var(--text-dim); padding: 40px 12px; }\n.empty .big { font-size: 40px; display: block; margin-bottom: 8px; }\n\nbutton.btn {\n  font-family: inherit; font-size: 15px; font-weight: 700;\n  border: none; border-radius: 14px; padding: 15px 18px; cursor: pointer;\n  background: var(--accent); color: var(--on-accent); width: 100%; transition: transform .1s, opacity .2s;\n}\nbutton.btn:active { transform: scale(.98); }\nbutton.btn.secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }\nbutton.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }\nbutton.btn.danger { background: transparent; color: var(--ng); border: 1px solid var(--ng); }\nbutton.btn:disabled { opacity: .5; }\nbutton.btn.small { padding: 9px 12px; font-size: 13px; width: auto; }\n\n/* ---------- 日付入力 ----------\n   color-scheme:dark を指定しないとネイティブのカレンダーアイコンが黒のまま埋もれる */\ninput[type=\"date\"] { color-scheme: dark; }\n.date-in {\n  background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);\n  font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; border-radius: 8px;\n  width: auto; margin: 0;\n}\n/* iOSのdate入力は固有幅を持ち width:100% を無視してカードからはみ出すことがある。\n   外観を無効化し、親幅に収まるよう強制する */\ninput[type=\"date\"] {\n  -webkit-appearance: none; appearance: none;\n  min-width: 0; max-width: 100%; display: block; min-height: 45px;\n}\n.date-in[type=\"date\"] { min-height: 0; display: inline-block; width: auto; }\n\n/* ---------- テーマ(アクセント色)選択 ---------- */\n.theme-grid { display: flex; gap: 10px; }\n.theme-opt {\n  flex: 1; min-width: 0; background: var(--bg-elev); border: 2px solid var(--border);\n  border-radius: 12px; padding: 10px; cursor: pointer; color: var(--text-dim);\n  font-family: inherit; font-size: 13px; font-weight: 600;\n  display: flex; flex-direction: column; align-items: center; gap: 8px;\n}\n.theme-opt.active { border-color: var(--accent); color: var(--text); }\n.theme-opt .sw { display: flex; width: 100%; height: 28px; border-radius: 7px; overflow: hidden; border: 1px solid var(--border2); }\n.theme-opt .sw i { display: block; height: 100%; }\n.theme-opt .sw i:first-child { flex: 2; }\n.theme-opt .sw i:last-child { flex: 1; }\n/* .row 内のボタンは width:100% 同士がぶつかって潰れ、文字が折り返してしまうため\n   伸縮ルールを明示する(small は内容幅を確保して折り返さない)。 */\n.row > button.btn { flex: 1; min-width: 0; }\n.row > button.btn.small { flex: 0 0 auto; white-space: nowrap; }\n\n.pill {\n  display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px;\n  background: var(--bg-elev); color: var(--text-dim); border: 1px solid var(--border);\n}\n.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }\n\n/* 部位バッジ */\n.mtag { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }\n.m-chest { color: var(--m-chest); border-color: var(--m-chest); }\n.m-back { color: var(--m-back); border-color: var(--m-back); }\n.m-legs { color: var(--m-legs); border-color: var(--m-legs); }\n.m-shoulder { color: var(--m-shoulder); border-color: var(--m-shoulder); }\n.m-arm { color: var(--m-arm); border-color: var(--m-arm); }\n.m-abs { color: var(--m-abs); border-color: var(--m-abs); }\n.m-cardio { color: var(--m-cardio); border-color: var(--m-cardio); }\n\n.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }\n.chip {\n  font-size: 13px; padding: 8px 14px; border-radius: 999px; cursor: pointer;\n  background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);\n  white-space: nowrap;\n}\n.chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }\n.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }\n\n/* ---------- inputs ---------- */\ninput, textarea, select {\n  font-family: inherit; font-size: 15px; color: var(--text);\n  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;\n  padding: 11px 12px; width: 100%;\n}\ninput:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }\ntextarea { resize: vertical; min-height: 64px; }\nlabel.field { display: block; margin-bottom: 12px; }\nlabel.field .lab { font-size: 13px; color: var(--text-dim); margin-bottom: 5px; display: block; }\n.num-in { text-align: center; }\n.seg { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }\n.seg button {\n  flex: 1; background: var(--bg-elev); border: none; color: var(--text-dim);\n  padding: 10px; font-family: inherit; font-size: 14px; cursor: pointer;\n}\n.seg button.active { background: var(--accent); color: var(--on-accent); font-weight: 700; }\n\n/* ---------- workout / sets ---------- */\n.ex-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }\n.ex-head { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--border); }\n.ex-head .name { font-weight: 600; flex: 1; }\n.ex-head .kebab { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 0 4px; }\n.ex-head .ex-del { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; display: inline-flex; align-items: center; border-radius: 8px; -webkit-tap-highlight-color: transparent; }\n.ex-head .ex-del:hover, .ex-head .ex-del:active { color: var(--ng); background: color-mix(in srgb, var(--ng) 14%, transparent); }\n.set-table { width: 100%; border-collapse: collapse; }\n.set-table th { font-size: 11px; color: var(--text-dim); font-weight: 500; padding: 8px 4px 6px; text-align: center; }\n.set-table td { padding: 5px 4px; text-align: center; }\n.set-table td:first-child, .set-table th:first-child { width: 38px; }\n.set-table .setno { color: var(--text-dim); font-size: 13px; }\n.set-table .setno.warm { color: var(--warn); }\n.set-in { width: 62px; text-align: center; padding: 8px 4px; margin: 0 auto; }\n.set-done {\n  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);\n  background: var(--bg-elev); color: var(--text-dim); font-size: 16px; cursor: pointer;\n}\n/* アクセント色の上は白だとコントラスト比1.18でほぼ読めない。必ず --on-accent を使う */\n.set-done.on { background: var(--ok); border-color: var(--ok); color: var(--on-accent); font-weight: 700; }\n.set-row.done .set-in { opacity: .7; }\n.set-del { background: none; border: none; color: var(--ng); font-size: 15px; cursor: pointer; padding: 4px; }\n.ex-foot { padding: 8px 14px 12px; display: flex; gap: 8px; }\n.link-btn { background: none; border: none; color: var(--accent); font-family: inherit; font-size: 13px; cursor: pointer; padding: 6px 0; }\n.link-btn.warm { color: var(--warn); }\n.link-btn.dim { color: var(--text-dim); }\n\n/* ---------- rest timer ---------- */\n.timer-bar {\n  position: fixed; left: 50%; transform: translateX(-50%);\n  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 10px);\n  z-index: 30; width: calc(100% - 24px); max-width: 616px;\n  background: var(--accent); color: var(--on-accent); border-radius: 14px;\n  display: flex; align-items: center; gap: 10px; padding: 12px 16px;\n  box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: fade .2s ease;\n  font-weight: 600;\n}\n.timer-bar { position: fixed; overflow: hidden; }\n.timer-bar .tl1 { font: 700 10px var(--font-num); letter-spacing: .12em; text-transform: uppercase; opacity: .8; }\n.timer-bar .t { font-family: var(--font-mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }\n.timer-bar .tprog { position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(0,0,0,.30); transition: width 1s linear; }\n/* 一時停止中はバーを落ち着かせて状態を伝える */\n.timer-bar.paused { opacity: .85; }\n.timer-bar.paused .t { opacity: .7; }\n/* バー表示中は本文の下余白を広げる(最下段の入力・保存ボタンが隠れないように) */\nbody.has-timer #app { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 78px); }\n.timer-bar[data-act] { cursor: pointer; }\n\n/* ---------- インラインSVGアイコン(絵文字の代替) ---------- */\n.ic { width: 15px; height: 15px; vertical-align: -2.5px; display: inline-block; flex: none; }\n.empty .ic { width: 34px; height: 34px; display: block; margin: 0 auto 10px; opacity: .45; }\n.ng-gear .ic { vertical-align: middle; }\n.timer-bar button .ic, .tb-controls button .ic { vertical-align: -2px; }\n/* ボタン内アイコンは中央に置く(セット✓/✕・⋯メニュー・ピッカーのinfo) */\n.set-done .ic, .set-del .ic, .kebab .ic, .ex-del .ic, .pick-info .ic { vertical-align: middle; display: block; margin: 0 auto; }\n.mc-check .ic { vertical-align: -3px; }\n.abar-int .ic { margin-right: 2px; }\n/* 柱カラーの小ドット(バランス画面のラベル用) */\n.dotc { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; flex: none; }\n\n/* ---------- 3本柱バランス(グラフタブ) ---------- */\n.bgrid { display: flex; flex-direction: column; gap: 10px; }\n.bg-row { display: flex; align-items: center; }\n.bg-lab { width: 76px; flex: none; font-size: 12px; color: var(--text-dim); }\n.bg-c { flex: 1; display: flex; justify-content: center; font-size: 10px; color: var(--text-mute); font-family: var(--font-mono); }\n.bg-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--bg-elev); display: block; }\n.bt-lab { font: 600 11px var(--font-num); color: var(--text-dim); margin: 12px 0 4px; }\n.bt-lab:first-of-type { margin-top: 0; }\n\n/* ---------- オフの日(休養日・食事なし) ---------- */\n.rest-card {\n  background: var(--bg-hi); border: 1.5px solid var(--border); border-radius: 14px;\n  padding: 15px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 18px;\n}\n.rest-card .rc-main { flex: 1; min-width: 0; }\n.rest-card .rc-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 7px; }\n.rest-card .rc-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }\n.rest-card .link-btn { flex: none; white-space: nowrap; }\n.offrow {\n  display: flex; align-items: center; gap: 12px; cursor: pointer;\n  background: var(--bg-card2); border: 1px solid var(--border); border-radius: 12px;\n  padding: 11px 14px; margin-bottom: 14px;\n}\n.offrow.on { border-color: var(--accent); }\n.offrow .or-main { flex: 1; min-width: 0; }\n.offrow .or-name { font-size: 14px; font-weight: 600; }\n.offrow .or-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }\n.offrow .set-done { display: flex; align-items: center; justify-content: center; flex: none; }\n/* 休養日はカレンダーで輪郭だけ示す(実施日=塗り、未記録=無印と区別) */\n.cal-cell.rest { border: 1.5px dashed var(--border); color: var(--text-dim); }\n.bg-dot.off { background: transparent; border: 2px solid var(--faint); box-sizing: border-box; }\n.bg-legend { display: flex; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border2); font-size: 11px; color: var(--text-dim); }\n.bg-legend span { display: flex; align-items: center; gap: 5px; }\n\n/* ---------- 睡眠(就寝・起床から算出した時間を主役に) ---------- */\n.sleep-dial {\n  background: var(--bg-card2); border: 1px solid var(--border); border-radius: 14px;\n  padding: 18px 16px; text-align: center; margin-bottom: 14px;\n}\n.sleep-dial .sd-lab { font: 600 10px var(--font-num); letter-spacing: .12em; color: var(--text-dim); text-transform: uppercase; }\n.sleep-dial .sd-val { font: 700 30px var(--font-num); line-height: 1.2; margin: 2px 0; }\n.sleep-dial .sd-note { font-size: 12px; color: var(--text-dim); }\n.sleep-dial.met .sd-val { color: var(--accent); }\n.sleep-dial.met .sd-note { color: var(--accent); }\n\n/* ---------- 食事(合計と残り→区分ごとに品目を積む) ---------- */\n.food-sum { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }\n.food-sum .fs-main { display: flex; align-items: baseline; gap: 7px; }\n.food-sum .fs-n { font: 700 28px var(--font-num); line-height: 1; }\n.food-sum .fs-u { font-size: 12px; color: var(--text-dim); }\n.food-sum .fs-bar { height: 5px; border-radius: 3px; background: var(--bg-elev); overflow: hidden; margin: 9px 0 7px; }\n.food-sum .fs-bar i { display: block; height: 10 "info-head\"><button class=\"back-btn\" data-act=\"sheet-close\">‹ 閉じる</button></div><h2>お問い合わせ</h2>\n      <label class=\"field\"><span class=\"lab\">内容</span>\n        <textarea id=\"ct-msg\" rows=\"5\" placeholder=\"ご意見・不具合・欲しい機能など、なんでもどうぞ\"></textarea></label>\n      <label class=\"field\"><span class=\"lab\">返信先メール（任意）</span>\n        <input id=\"ct-mail\" type=\"email\" inputmode=\"email\" placeholder=\"you@example.com\"></label>\n      <button class=\"btn mb\" id=\"ct-send\" data-act=\"contact-send\">送信する</button>\n      <p class=\"muted small\">開発者に届くのは、入力した内容・返信先・アプリのバージョン情報のみです。</p></div></div>"}];
const TAGS=['配色が見にくい','文字が小さい','余白が窮屈','導線が分かりにくい','不要な要素','情報が足りない','ボタン位置','文言を変えたい'];
let notes={}; try{notes=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

function frameDoc(s){
  return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>'+CSS+
    '\n#app{min-height:812px}.sheet{max-height:700px}body{overflow:hidden}</style></head>'+
    '<body class="'+(s.bodyClass||'')+'"><div id="app">'+s.html+'</div></body></html>';
}
function render(){
  const main=document.getElementById('main');
  let cur='';
  SCREENS.forEach(s=>{
    if(s.cat!==cur){ cur=s.cat; const h=document.createElement('div'); h.className='cat'; h.textContent=s.cat; main.appendChild(h); }
    const c=document.createElement('div'); c.className='card';
    c.innerHTML='<div class="top"><span class="id">'+s.id+'</span><span class="nm">'+s.name+'</span></div>'+
      '<div class="ds">'+s.desc+'</div>'+
      '<div class="body"><div class="frame"><iframe loading="lazy" data-id="'+s.id+'"></iframe></div>'+
      '<div class="note"><label>'+s.id+' の修正点</label>'+
      '<div class="tags">'+TAGS.map(t=>'<button data-t="'+t+'" data-id="'+s.id+'">+ '+t+'</button>').join('')+'</div>'+
      '<textarea data-id="'+s.id+'" placeholder="例）ここの文字が小さい / このボタンは要らない / 並び順を変えたい"></textarea></div></div>';
    main.appendChild(c);
  });
  // iframeは画面に近づいたものだけ生成する(全部同時に作ると重いため)
  const io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting || e.target.dataset.loaded) return;
      e.target.dataset.loaded='1';
      e.target.setAttribute('srcdoc', frameDoc(SCREENS.find(x=>x.id===e.target.dataset.id)));
    });
  },{rootMargin:'800px'});
  document.querySelectorAll('iframe').forEach(f=>io.observe(f));
  document.querySelectorAll('textarea[data-id]').forEach(t=>{
    t.value=notes[t.dataset.id]||'';
    t.classList.toggle('has', !!t.value.trim());
    t.addEventListener('input',()=>{
      notes[t.dataset.id]=t.value;
      localStorage.setItem(KEY,JSON.stringify(notes));
      t.classList.toggle('has', !!t.value.trim());
      updateCount();
    });
  });
  document.querySelectorAll('.tags button').forEach(b=>{
    b.addEventListener('click',()=>{
      const t=document.querySelector('textarea[data-id="'+b.dataset.id+'"]');
      t.value=(t.value?t.value.replace(/\n$/,'')+'\n':'')+'・'+b.dataset.t+' → ';
      t.dispatchEvent(new Event('input'));
      t.focus(); t.setSelectionRange(t.value.length,t.value.length);
    });
  });
  updateCount();
}
function updateCount(){
  document.getElementById('cnt').textContent=Object.values(notes).filter(v=>v&&v.trim()).length;
}
let folded=false;
function toggleAll(){
  folded=!folded;
  document.querySelectorAll('.frame').forEach(f=>f.style.display=folded?'none':'');
}
function exportAll(){
  const lines=['# 画面の修正メモ（筋トレ記録アプリ v49）',''];
  SCREENS.forEach(s=>{
    const v=(notes[s.id]||'').trim();
    if(!v) return;
    lines.push('## '+s.id+' '+s.name+'（'+s.cat+'）');
    lines.push(v); lines.push('');
  });
  if(lines.length<3) lines.push('（まだ記入がありません）');
  document.getElementById('out').value=lines.join('\n');
  document.getElementById('dlg').showModal();
}
function copyOut(){
  const o=document.getElementById('out');
  o.removeAttribute('readonly'); o.select();
  try{ navigator.clipboard.writeText(o.value); }catch(e){ document.execCommand('copy'); }
  o.setAttribute('readonly','');
  alert('コピーしました');
}
render();
</script>
